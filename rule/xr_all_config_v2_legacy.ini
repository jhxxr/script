;===== 按来源 =====
custom_proxy_group=⭐ 优选线路`select`((?i)xxc)
custom_proxy_group=⭐ 优选自动`url-test`((?i)xxc)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 故障转移`fallback`((?i)xxc)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌐 备用线路`select`(^(?!.*(?i)xxc).*)
custom_proxy_group=🌐 备用自动`url-test`(^(?!.*(?i)xxc).*)`http://www.gstatic.com/generate_204`300,,50

